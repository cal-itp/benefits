ci:
  autofix_commit_msg: "chore(pre-commit): autofix run"
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hooks"

# by default, install these hook types
# https://pre-commit.com/#top_level-default_install_hook_types
default_install_hook_types:
  - pre-commit
  - commit-msg

# by default, confine hooks to these git stages (except for hooks that specify their own stages)
# https://pre-commit.com/#top_level-default_stages
default_stages: [pre-commit]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "docs/reference/newsletter-archive/exports"
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: "docs/reference/newsletter-archive/exports"
      - id: requirements-txt-fixer
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=1500"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        types:
          - python

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll"]
        files: .py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        types:
          - python

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      - id: djlint-reformat-django
        exclude: "docs/reference/newsletter-archive/exports"
      - id: djlint-django
        exclude: "docs/reference/newsletter-archive/exports"
