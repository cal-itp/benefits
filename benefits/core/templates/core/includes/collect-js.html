<script nonce="{{ request.csp_nonce }}"
        src="https://secure.nmi.com/token/Collect.js"
        data-tokenization-key="{{ collect_js_api_key }}"></script>
<script nonce="{{ request.csp_nonce }}">
    const cardSchemes = JSON.parse("{{ card_schemes|escapejs }}");
    const isSupportedScheme = (scheme) => cardSchemes.includes(scheme);

    // we consider each input invalid prior to interaction
    const validFields = {
      ccnumber: false,
      ccexp: false,
    };

    const revalidateField = (field, valid) => {
      validFields[field] = valid;
      const errNode = document.querySelector(`#${field} + .cjs-error`);
      if (errNode) {
        valid ? errNode.classList.add("d-none") : errNode.classList.remove("d-none");
      }
    }

    const setLoadingVisibility = (visible) => {
      const overlay = document.querySelector("#loading_registering");
      visible
        ? overlay.classList.remove("invisible")
        : overlay.classList.add("invisible");
    };

    const formHasInvalidInput = () => !(validFields.ccnumber && validFields.ccexp);

    const showErrorBanner = () => {
      const form = document.querySelector("form#form-cjs-tokenization");
      const banner = document.querySelector(".cjs-error-banner");
      banner.querySelector('li[data-field="ccnumber"]').hidden = validFields.ccnumber;
      banner.querySelector('li[data-field="ccexp"]').hidden = validFields.ccexp;
      banner.hidden = !formHasInvalidInput();
    };

    const opts = {
      variant: "inline",
      // fires when the <iframe>d inputs have finally rendered
      fieldsAvailableCallback: function() {
        document.querySelectorAll(".placeholder").forEach((ph) => {
          ph.classList.add("d-none")
        })
      },
      invalidCss: {
        "border-color": "#de0e10",
      },
      fields: {
        ccnumber: {
          selector: "#ccnumber",
          placeholder: "1111 1111 1111 1111",
          enableCardBrandPreviews: "true",
        },
        ccexp: {
          selector: "#ccexp",
          title: "Expiration date",
          placeholder: "MM / YY",
        },
        cvv: { display: "hide" }
      },
      timeoutDuration: 10000,
      validationCallback: revalidateField,
      // Fires as soon as the card number is identified as valid
      lookUpCallback: function(response) {
        revalidateField("ccnumber", isSupportedScheme(response.type));
      },
      timeoutCallback: function() {
        setLoadingVisibility(false);
        const errForm = document.querySelector("form#{{ form_system_error }}");
        errForm.submit();
      },
      // Fires when tokenization completes
      callback: function(response) {
        // if an unsupported scheme is encountered, do not attempt to register the tokenized card
        if (!isSupportedScheme(response.card.type)) {
          revalidateField("ccnumber", false); // display the inline-error message
          showErrorBanner(); // display the error summary
          setLoadingVisibility(false);
          return;
        }

        // we don't hide the loadingOverlay on success because we still need to register the tokenized card
        const form = document.querySelector("form#{{ form_success }}");
        form.elements["card_token"].value = response.token;

        {% if request.recaptcha %}
          // the reCAPTCHA on this page is a deviation in that it is *not* triggered via the submit button
          // on a user-facing form. instead a tokenized response is retrieved from Collect.js
          // and passed to our own backend via an ancillary form POST
          // the success form includes only hidden inputs and lacks a submit button
          grecaptcha.ready(function() {
            grecaptcha.execute("{{ request.recaptcha.site_key }}", { action: "submit" })
              .then(function(gToken) {
                form.elements["{{ request.recaptcha.data_field }}"].value = gToken;
                form.submit();
              });
          });
        {% else %}
          form.submit();
        {% endif %}
      },
    };

    document.addEventListener("DOMContentLoaded", function() {
      CollectJS.configure(opts);

      document.querySelector("#tokenizeButton").addEventListener("click", function() {
        // when invalid input(s) are detected, do not attempt tokenization
        if (formHasInvalidInput()) {
          revalidateField("ccnumber", validFields.ccnumber);
          revalidateField("ccexp", validFields.ccexp);
          showErrorBanner();
        } else {
          CollectJS.startPaymentRequest();
          setLoadingVisibility(true);
        }
      });
    });
</script>
