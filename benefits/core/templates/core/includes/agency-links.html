<p class="fw-semibold mt-3 d-block">{{ agency_name | default:agency.long_name }}</p>
<ul class="list-unstyled mt-1">
  <li>
    <a href="tel:{{ phone | default:agency.phone }}">{{ phone | default:agency.phone }}</a>
  </li>
  <li>
    <a href="{{ info_url | default:agency.info_url }}"
       target="_blank"
       rel="noopener noreferrer">{{ info_url | default:agency.info_url }}</a>
  </li>
</ul>
