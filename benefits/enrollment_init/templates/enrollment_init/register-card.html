{% extends "core/base.html" %}

{% load i18n %}
{% load static %}

{% block preload %}
  <script nonce="{{ request.csp_nonce }}" src="https://secure.nmi.com/token/Collect.js" data-tokenization-key="{{ collect_js_api_key }}">
  </script>
  <script src="{% static "js/init-tokenize.js" %}" nonce="{{ request.csp_nonce }}"></script>
{% endblock preload %}

{% block inner-content %}
  <h1 class="mb-4">{% translate "Enter card details" %}</h1>
  <form id="tokenization-form" method="post">
    {% csrf_token %}
    <div class="cjs-input mt-3">
      <span>{% translate "Card number" %}</span>
      <div id="ccnumber"></div>
      <div class="cjs-error"></div>
    </div>
    <div class="cjs-input mt-4">
      <span>{% translate "Expiration date" %}</span>
      <div id="ccexp"></div>
      <div class="cjs-error"></div>
    </div>
    <div id="cvv" hidden></div>
    <input name="tokenized_card" id="tokenized-card" type="text" hidden>
    <button class="btn btn-lg btn-primary mt-5" id="tokenizeButton" type="button">{% translate "Register your card" %}</button>
  </form>
{% endblock inner-content %}
