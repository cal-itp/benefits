<!DOCTYPE html>
<html lang="en">
  <!-- djlint:off -->

<head>
  <title>Collect.js Demo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This sets a PCI compliance CSP -->
  <!-- The nonce must be securely generated by your hosting page per page-load -->
  <meta http-equiv="Content-Security-Policy" content="
	  default-src 'none';
	  script-src 'self' https://secure.nmi.com https://applepay.cdn-apple.com 'nonce-abc123';
	  style-src 'self' https://secure.nmi.com 'nonce-abc123';
	  connect-src https://secure.nmi.com;
	  frame-src https://secure.nmi.com;
	  base-uri 'none';
	  form-action 'self';
	">
  <meta name="description" content="Demo of Collect.js - HTML example from their documentation">

  <!-- This loads Collect.js from the server -->
  <script src="https://secure.nmi.com/token/Collect.js" data-tokenization-key="W7a2Z7-GuwUy8-AK4G68-MKAEFv"></script>
</head>

<body>
  <h1>Payment Component Sample</h1>
  <!-- Create a form that will submit all customer data as well
			 as the Collect.js payment token to another page on your
			 server -->
  <form action="./success.html" method="get">
    <!-- Credit card fields -->
    <div class="input">
      <span>Card Number</span>
      <div id="demoCcnumber"></div>
    </div>
    <div class="input">
      <span>Expiration Date</span>
      <div id="demoCcexp"></div>
    </div>
    <div class="input">
      <span>CVV</span>
      <div id="demoCvv"></div>
    </div>
    <!-- Submit the form to your server -->
    <button id="demoPayButton" type="button">Pay</button>
  </form>

  <!-- The nonce must be securely generated by your hosting page per page-load -->
  <script nonce="abc123">
    // This will load Collect.js and render text fields
    // on page load, but you can call "CollectJS.configure"
    // whenever you want to load the payment form fields
    document.addEventListener("DOMContentLoaded", function () {
      CollectJS.configure({
        paymentSelector: "#demoPayButton",
        variant: "inline",
        // invalidCss: {
        //   color: "#e74c3c",
        //   "border-color": "#e74c3c",
        // },
        // validCss: {
        //   color: "black",
        //   "border-color": "#2ecc71",
        // },
        // placeholderCss: {
        //   color: "darkgray",
        //   "background-color": "#ffffff",
        // },
        // focusCss: {
        //   color: "black",
        //   "border-color": "#4681f4",
        // },
        fields: {
          ccnumber: {
            selector: "#demoCcnumber",
            title: "Card Number",
            placeholder: "0000 0000 0000 0000",
            enableCardBrandPreviews: "true"
          },
          ccexp: {
            selector: "#demoCcexp",
            title: "Card Expiration",
            placeholder: "00 / 00",

          },
          cvv: {
            display: "show",
            selector: "#demoCvv",
            title: "CVV Code",
            placeholder: "123",
          }
        },
        price: "1.00",
        currency: "USD",
        country: "US",
        validationCallback: function (field, status, message) {
          if (status) {
            var message = field + " is now OK: " + message;
          } else {
            var message = field + " is now Invalid: " + message;
          }
          console.log(message);
        },
        timeoutDuration: 10000,
        timeoutCallback: function () {
          console.log(
            "The tokenization didn't respond in the expected timeframe.  This could be due to an invalid or incomplete field or poor connectivity"
          );
        },
        fieldsAvailableCallback: function () {
          console.log("Collect.js loaded the fields onto the form");
        },
        callback: function (response) {
          alert(JSON.stringify(response));
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = "payment_token";
          input.value = response.token;
          var form = document.getElementsByTagName("form")[0];
          form.appendChild(input);
          form.submit();
        },
      });
    });
  </script>
  <style nonce="abc123">
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 400px;
      margin: 0 auto;
      padding: 15px;
      background-color: #f5f5f5;
      color: #333;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-weight: 300;
      font-size: 24px;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .input {
      margin-bottom: 15px;
    }

    .input span {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #555;
      font-size: 13px;
    }

    .input input {
      width: 100%;
      padding: 8px;
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    .input input:focus {
      outline: none;
      border-color: #4681f4;
    }

    #demoPayButton {
      width: 100%;
      padding: 12px;
      background-color: #4681f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.3s ease;
    }

    #demoPayButton:hover {
      background-color: #3f73dd;
    }

    #demoPayButton:active {
      transform: translateY(1px);
    }
  </style>
</body>

</html>
